<template id="page-title-template">
    <h1>🏠 Ezviz</h1>
</template>

<div class="page-ezviz">
    <div class="card page-card">
        <div class="meta">
            <div class="loading" id="e_loading">
                <div class="spinner"></div>
                <div>Cargando desde BigQuery…</div>
            </div>
        </div>

        <div class="search-container">
            <div class="search-input-wrapper">
                <span class="search-icon">🔎</span>
                <input id="ez_search" type="text" placeholder="Buscar por Hik code / Modelo / Descripción"
                    class="search-input" />
            </div>

            <div id="ez_filter_anchor"></div>

            <div class="chip">Filas: <span id="ez_hits">0</span></div>

            <button id="ez_select_all" class="btn-clear btn-select-all" title="Seleccionar todos">✓</button>
            <button id="ez_unselect_all" class="btn-clear btn-unselect-all" title="Deseleccionar todos">☐</button>
            <button id="ez_download" class="btn-clear" title="Descargar Excel">📥</button>
            <button id="ez_clear" class="btn-clear" title="Limpiar todo">✖</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="col-check"></th>
                        <th class="sortable" data-key="hik_code" style="width:120px;">Hik code</th>
                        <th class="sortable" data-key="nomenclatura_oficial" style="width:130px;">Nomenclatura</th>
                        <th class="sortable" data-key="modelo" style="width:200px;">Modelo</th>
                        <th class="sortable" data-key="descripcion" style="min-width:600px;">Descripción</th>
                        <th class="sortable" data-key="categoria" style="width:150px;">Categoría</th>
                        <th class="sortable" data-key="subcategoria" style="width:150px;">Subcategoría</th>
                        <th class="sortable" data-key="gremio" style="width:100px;">Gremio</th>
                        <th class="sortable" data-key="disponible" style="width:100px;">Stock</th>
                        <th class="sortable" data-key="en_transito" style="width:110px;">En Transito</th>
                    </tr>
                </thead>
                <tbody id="e_tbody"></tbody>
                <tfoot id="ez_tfoot">
                    <tr>
                        <td colspan="13" style="text-align: center;">Total de productos Ezviz: <span
                                id="ez_total_count">0</span></td>
                    </tr>
                </tfoot>
            </table>
        </div>
        <div class="error" id="e_error"></div>
    </div>
</div>

<script>
    (function () {
        let allRows = [];
        let originalRows = [];
        let currentSort = { key: null, dir: 0 };
        let selectedCat = null, selectedSub = null;

        const tbody = document.getElementById("e_tbody");
        const loadingEl = document.getElementById("e_loading");
        const errorEl = document.getElementById("e_error");
        const hitsEl = document.getElementById("ez_hits");
        const searchEl = document.getElementById("ez_search");
        const clearBtn = document.getElementById("ez_clear");

        function updateHits() {
            if (hitsEl) {
                const sel = originalRows.filter(r => r._selected).length;
                hitsEl.innerHTML = `Seleccionadas: <b>${sel}</b> / ${allRows.length}`;
            }
        }

        function render(rows) {
            tbody.innerHTML = "";
            const frag = document.createDocumentFragment();
            const q = searchEl.value;
            rows.forEach(r => {
                const tr = document.createElement("tr");
                const tdCheck = document.createElement("td");
                tdCheck.className = "col-check";
                const chk = document.createElement("input");
                chk.type = "checkbox";
                chk.checked = !!r._selected;
                chk.onchange = () => { r._selected = chk.checked; updateHits(); };
                tdCheck.appendChild(chk);
                tr.appendChild(tdCheck);

                const cols = ["hik_code", "nomenclatura_oficial", "modelo", "descripcion", "categoria", "subcategoria", "gremio", "disponible", "en_transito"];
                cols.forEach(key => {
                    const td = document.createElement("td");
                    let val = r[key];
                    if (["gremio", "disponible", "en_transito"].includes(key)) val = window.utils.fmtNum(val);
                    if (key === "modelo") val = (val || "").toUpperCase();
                    td.innerHTML = window.utils.highlight(val, q);
                    if ((r.es_oferta || "").includes(key)) td.classList.add("is-offer");
                    tr.appendChild(td);
                });
                frag.appendChild(tr);
            });
            tbody.appendChild(frag);
            updateHits();
        }

        function applyFilter() {
            const q = window.utils.norm(searchEl.value);
            let data = originalRows.filter(r => {
                const matchQ = !q || ["hik_code", "modelo", "descripcion"].some(k => window.utils.norm(r[k]).includes(q));
                const matchCat = !selectedCat || (r.categoria || "").trim().toUpperCase() === selectedCat;
                const matchSub = !selectedSub || (r.subcategoria || "").trim().toUpperCase() === selectedSub;
                return matchQ && matchCat && matchSub;
            });

            if (currentSort.dir > 0) {
                data.sort((a, b) => {
                    const vA = window.utils.smartConvert(a[currentSort.key]), vB = window.utils.smartConvert(b[currentSort.key]);
                    return currentSort.dir === 1 ? (vA < vB ? -1 : 1) : (vA > vB ? -1 : 1);
                });
            }
            allRows = data;
            render(allRows);
        }

        function handleSort(th) {
            const key = th.dataset.key;
            if (currentSort.key === key) currentSort.dir = (currentSort.dir + 1) % 3;
            else { currentSort.key = key; currentSort.dir = 1; }
            document.querySelectorAll("thead th.sortable").forEach(el => el.classList.remove("asc", "desc"));
            if (currentSort.dir === 1) th.classList.add("asc");
            if (currentSort.dir === 2) th.classList.add("desc");
            applyFilter();
        }

        searchEl.oninput = applyFilter;
        clearBtn.onclick = () => { searchEl.value = ""; selectedCat = selectedSub = null; applyFilter(); };
        document.getElementById("ez_select_all").onclick = () => { allRows.forEach(r => r._selected = true); render(allRows); };
        document.getElementById("ez_unselect_all").onclick = () => { allRows.forEach(r => r._selected = false); render(allRows); };
        document.getElementById("ez_download").onclick = () => window.utils.exportToExcel(originalRows.filter(r => r._selected), "ezviz.xlsx");

        document.querySelectorAll("thead th.sortable").forEach(th => th.onclick = () => handleSort(th));

        function load() {
            loadingEl.style.display = "flex";
            google.script.run.withSuccessHandler(rows => {
                originalRows = (rows || []).map(r => ({ ...r, _selected: false }));
                document.getElementById("ez_total_count").textContent = originalRows.length;
                const anchor = document.getElementById("ez_filter_anchor");
                anchor.innerHTML = "";
                anchor.appendChild(window.utils.buildCategoryUI(originalRows, (cat, sub) => { selectedCat = cat; selectedSub = sub; applyFilter(); }));
                applyFilter();
                loadingEl.style.display = "none";
            }).getEzvizFromBQ();
        }
        load();
    })();
</script>
